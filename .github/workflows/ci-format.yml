# This workflow is managed by gh actions-lock.

name: Formatting CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: AnvilSaba/platform/.github/actions/setup-mise@main
        with:
          install-args: node rust npm:oxfmt
      - run: mise run fmt:check
