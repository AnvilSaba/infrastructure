# This workflow is managed by gh actions-lock.

name: Formatting CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: AnvilSaba/platform/.github/actions/setup-mise@main
        with:
          install-args: gh node rust npm:oxfmt
      - name: Verify Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise exec -- gh extension install github/gh-actions-lock --pin v0.1.6
          mise exec -- gh actions-lock --verify-local
      - run: mise run fmt:check
