# This workflow is managed by gh actions-lock.
name: Update staging
on:
  repository_dispatch:
    types: [platform-artifact]
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: token
        with:
          app-id: ${{ vars.GITOPS_UPDATE_APP_ID }}
          private-key: ${{ secrets.GITOPS_UPDATE_APP_PRIVATE_KEY }}
          owner: AnvilSaba
          repositories: infrastructure
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/create-github-app-token@v3.3.0
        id: source-token
        with:
          app-id: ${{ vars.GITOPS_READ_APP_ID }}
          private-key: ${{ secrets.GITOPS_READ_APP_PRIVATE_KEY }}
          owner: AnvilSaba
          repositories: platform
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          repository: AnvilSaba/platform
          ref: main
          fetch-depth: 0
          path: .platform-source
          token: ${{ steps.source-token.outputs.token }}
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.1
        with:
          minimum_release_age: 7d
          install_args: rust node helm npm:oxfmt
      - name: Validate and commit against latest main
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          REGISTRY_TOKEN: ${{ secrets.GITOPS_REGISTRY_READ_TOKEN }}
          REGISTRY_USER: ${{ vars.GITOPS_REGISTRY_USER }}
        run: |
          printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/notification.json"
          git config user.name 'gitops-update[bot]'
          git config user.email 'gitops-update[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mise exec -- cargo -Zscript scripts/update.rs staging "$RUNNER_TEMP/notification.json" .platform-source
            mise exec -- oxfmt apps/staging/platform
            git add -- apps/staging/platform
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore(staging): 公開済み成果物を反映する'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo '::error::main の並行更新を解決できませんでした。通知を再実行してください。'
          exit 1
