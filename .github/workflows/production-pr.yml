# This workflow is managed by gh actions-lock.
name: Production update PR
on:
  repository_dispatch:
    types: [platform-release]
  workflow_dispatch:
    inputs:
      bot:
        description: 公開済み Bot release tag (bot/vX.Y.Z)
        type: string
      mc_link_server:
        description: 公開済み紐付けサーバー release tag (mc-link-server/vX.Y.Z)
        type: string
      public_api:
        description: 公開済み Public API release tag (public-api/vX.Y.Z)
        type: string
      chart:
        description: 公開済み Chart release tag (chart/vX.Y.Z)
        type: string
      migrator_revision:
        description: 必要な場合のみ公開済み Migrator の完全な Git SHA を指定
        type: string
permissions:
  contents: read
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: update
        with:
          app-id: ${{ vars.GITOPS_UPDATE_APP_ID }}
          private-key: ${{ secrets.GITOPS_UPDATE_APP_PRIVATE_KEY }}
          owner: AnvilSaba
          repositories: infrastructure
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/create-github-app-token@v3.3.0
        id: source
        with:
          app-id: ${{ vars.GITOPS_READ_APP_ID }}
          private-key: ${{ secrets.GITOPS_READ_APP_PRIVATE_KEY }}
          owner: AnvilSaba
          repositories: platform
          permission-contents: read
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.update.outputs.token }}
      - uses: actions/checkout@v7.0.1
        with:
          repository: AnvilSaba/platform
          ref: main
          fetch-depth: 0
          path: .platform-source
          token: ${{ steps.source.outputs.token }}
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.1
        with:
          minimum_release_age: 7d
          install_args: gh rust node helm npm:oxfmt
      - name: Prepare validated PR
        env:
          GH_TOKEN: ${{ steps.update.outputs.token }}
          REGISTRY_TOKEN: ${{ secrets.GITOPS_REGISTRY_READ_TOKEN }}
          REGISTRY_USER: ${{ vars.GITOPS_REGISTRY_USER }}
          EVENT_NAME: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          BOT: ${{ inputs.bot }}
          MC_LINK_SERVER: ${{ inputs.mc_link_server }}
          PUBLIC_API: ${{ inputs.public_api }}
          CHART: ${{ inputs.chart }}
          MIGRATOR: ${{ inputs.migrator_revision }}
        run: |
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            printf '%s' "$PAYLOAD" | jq -e '{releases:{(.component):.release},automatic:true,notification:.}' > "$RUNNER_TEMP/promotion.json"
          else
            jq -n --arg bot "$BOT" --arg mc "$MC_LINK_SERVER" --arg api "$PUBLIC_API" --arg chart "$CHART" --arg migrator "$MIGRATOR" \
              '{releases:({bot:$bot,"mc-link-server":$mc,"public-api":$api,chart:$chart}|with_entries(select(.value!=""))),migrator_revision:(if $migrator=="" then null else $migrator end)}' \
              > "$RUNNER_TEMP/promotion.json"
          fi
          git config user.name 'gitops-update[bot]'
          git config user.email 'gitops-update[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            base=$(git rev-parse HEAD)
            branch=$(mise exec -- cargo -Zscript scripts/update.rs production "$RUNNER_TEMP/promotion.json" .platform-source)
            mise exec -- oxfmt apps/production/platform
            git add -- apps/production/platform
            if git diff --cached --quiet; then exit 0; fi
            git checkout -B "$branch"
            git commit -m 'chore(production): 検証済みreleaseの配置を提案する'
            git fetch origin main
            if [ "$base" != "$(git rev-parse origin/main)" ]; then continue; fi
            remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
            git push --force-with-lease="refs/heads/$branch:$remote" origin "HEAD:refs/heads/$branch" || continue
            git fetch origin main
            if [ "$base" != "$(git rev-parse origin/main)" ]; then continue; fi
            {
              printf '公開済み release と成果物の digest・source revision・共有 Migrator を検証した更新です。\n\n'
              printf 'Parent: AnvilSaba/infrastructure#1\nImplements: AnvilSaba/infrastructure#5\nDepends on: AnvilSaba/infrastructure#2, AnvilSaba/infrastructure#3\n\n'
              printf 'source 移管完了前は merge しないでください。SQL の後方互換性と実環境の影響をレビューしてください。\n\n'
              printf '```json\n'; cat "$RUNNER_TEMP/promotion.json"; printf '\n```\n\n'
              printf '検証済み配置情報:\n\n```json\n'; cat apps/production/platform/artifacts.json; printf '\n```\n'
            } > "$RUNNER_TEMP/pr-body.md"
            mise exec -- cargo -Zscript scripts/update.rs pr "$branch" "$RUNNER_TEMP/pr-body.md"
            exit 0
          done
          echo '::error::並行更新を解決できませんでした。最新の状態で再実行してください。'
          exit 1
