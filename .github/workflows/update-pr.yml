# This workflow is managed by gh actions-lock.
name: Artifact update PR
on:
  push:
    branches: [automation/staging, automation/production]
  workflow_dispatch:
    inputs:
      environment:
        description: 更新 PR を作成する環境
        required: true
        default: staging
        type: choice
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: update-pr-${{ inputs.environment && format('automation/{0}', inputs.environment) || github.ref_name }}
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: update
        with:
          app-id: ${{ vars.GITOPS_UPDATE_APP_ID }}
          private-key: ${{ secrets.GITOPS_UPDATE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: AnvilSaba/platform/.github/actions/setup-mise@main
        with:
          install-args: gh
      - name: Open PR if absent
        env:
          GH_TOKEN: ${{ steps.update.outputs.token }}
          UPDATE_BRANCH: ${{ inputs.environment && format('automation/{0}', inputs.environment) || github.ref_name }}
        run: |
          environment="${UPDATE_BRANCH#automation/}"
          count=$(mise exec -- gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq length)
          if [ "$count" -eq 0 ]; then
            mise exec -- gh pr create --base main --head "$UPDATE_BRANCH" \
              --title "chore($environment): 公開済み成果物を更新する" --body-file ".github/$environment-update.md"
          fi
