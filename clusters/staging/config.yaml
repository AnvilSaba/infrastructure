apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-platform-config
  namespace: flux-system
spec:
  interval: 5m
  path: ./config/staging
  prune: true
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: staging-platform
  decryption:
    provider: sops
    secretRef:
      name: sops-age-staging
