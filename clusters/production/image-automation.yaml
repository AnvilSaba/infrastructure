apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-image-automation
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure/production/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: platform
  dependsOn:
    - name: flux-controllers
  timeout: 5m
