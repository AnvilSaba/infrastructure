apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-controllers
  namespace: flux-system
spec:
  interval: 5m
  path: ./infrastructure/base/controllers
  prune: false
  deletionPolicy: Orphan
  sourceRef:
    kind: GitRepository
    name: platform
  patches:
    - target:
        kind: Deployment
        name: image-automation-controller
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --feature-gates=GitAllBranchReferences=false
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: source-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: helm-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: image-reflector-controller
      namespace: flux-system
    - apiVersion: apps/v1
      kind: Deployment
      name: image-automation-controller
      namespace: flux-system
  timeout: 5m
