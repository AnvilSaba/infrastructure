apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: anvilsaba-staging
spec:
  # staging の DB、Secret、外部接続先、固定成果物を確認してから解除する。
  suspend: true
  interval: 5m
  releaseName: platform
  targetNamespace: anvilsaba-staging
  storageNamespace: anvilsaba-staging
  chartRef:
    kind: OCIRepository
    name: platform-chart
  valuesFrom:
    - kind: ConfigMap
      name: platform-staging-values
    - kind: ConfigMap
      name: platform-release-values
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    remediation:
      retries: 1
      strategy: rollback
