apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: platform-chart
  namespace: anvilsaba-staging
spec:
  interval: 5m
  url: oci://ghcr.io/anvilsaba/charts/platform
  ref:
    tag: main
    digest: "" # {"$imagepolicy": "flux-system:staging-chart:digest"}
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
