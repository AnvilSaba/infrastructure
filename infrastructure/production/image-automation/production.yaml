apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: production-bot
  labels:
    gitops.anvilsaba.dev/environment: production
spec:
  imageRepositoryRef:
    name: platform-bot
  filterTags:
    pattern: ^v?[0-9]+\.[0-9]+\.[0-9]+$
  policy:
    semver:
      range: ">=0.0.0"
  digestReflectionPolicy: IfNotPresent
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: production-mc-link-server
  labels:
    gitops.anvilsaba.dev/environment: production
spec:
  imageRepositoryRef:
    name: platform-mc-link-server
  filterTags:
    pattern: ^v?[0-9]+\.[0-9]+\.[0-9]+$
  policy:
    semver:
