apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: anvilsaba-staging
resources:
  - ../../base/database
patches:
  - target:
      kind: StorageClass
      name: platform-db-retain
    patch: |-
      - op: replace
        path: /metadata/name
        value: platform-staging-db-retain
  - target:
      kind: Cluster
      name: platform-db
    patch: |-
      - op: replace
        path: /spec/storage/storageClass
        value: platform-staging-db-retain
