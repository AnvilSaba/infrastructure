apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: staging-bot
  labels:
    gitops.anvilsaba.dev/environment: staging
spec:
  imageRepositoryRef:
    name: platform-bot
  filterTags:
    pattern: ^main$
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 1m
---
