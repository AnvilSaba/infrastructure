apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: platform-staging
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: platform-image-updates
  policySelector:
    matchLabels:
      gitops.anvilsaba.dev/environment: staging
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: gitops-update[bot]
        email: gitops-update[bot]@users.noreply.github.com
      messageTemplate: "chore(staging): 公開済み成果物の更新を提案する"
    push:
      branch: automation/staging
  update:
    path: ./apps/staging/platform
    strategy: Setters
