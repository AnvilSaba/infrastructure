[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
minimum_release_age = "7d"

[tools]
gh = "2.100.0"
node = "24.21.0"
helm = "4.2.4"
kubectl = "1.37.1"
"aqua:getsops/sops" = "3.13.3"
"aqua:helix-editor/helix" = "25.07.1"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.2"
"npm:oxfmt" = "0.71.0"

[task_config]
shell = "{% if os() == 'windows' %}cmd /d /c{% else %}sh -c{% endif %}"

[tasks.fmt]
description = "対応ファイルを整形する"
run = ["mise exec -- rustfmt --edition 2024 scripts/check.rs", "mise exec -- oxfmt"]

[tasks."fmt:check"]
description = "対応ファイルの整形を検査する"
run = ["mise exec -- rustfmt --edition 2024 --check scripts/check.rs", "mise exec -- oxfmt --check"]

[tasks.check]
description = "全 Kustomize ルートを探索して描画する"
run = "mise exec -- cargo -Zscript scripts/check.rs"

[tasks."sops:edit"]
description = "引数で指定した Secret を Helix で編集する"
usage = 'arg "<file>" help="編集する SOPS ファイル"'
env.SOPS_AGE_KEY_FILE = { required = true }
env.SOPS_EDITOR = "hx"
raw = true
run = 'sops edit "{{ usage.file }}"'

[tasks."kube:tunnel"]
description = "Kubernetes API への SSH ポートフォワーディングを行う"
env.KUBE_SSH_HOST = { required = true }
raw = true
run = 'ssh -NT -L 127.0.0.1:16443:127.0.0.1:6443 -o ExitOnForwardFailure=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "{{ env.KUBE_SSH_HOST }}"'
