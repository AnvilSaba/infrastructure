[settings]
experimental = true
idiomatic_version_file_enable_tools = ["rust"]
minimum_release_age = "7d"

[tools]
gh = "2.100.0"
node = "24.21.0"
helm = "4.2.4"
kubectl = "1.37.1"
"aqua:getsops/sops" = "3.13.3"
"aqua:FiloSottile/age" = "1.3.2"
"aqua:kubernetes-sigs/kustomize" = "5.8.2"
"npm:oxfmt" = "0.71.0"

[task_config]
shell = "{% if os() == 'windows' %}cmd /d /c{% else %}sh -c{% endif %}"

[tasks.fmt]
description = "対応ファイルを整形する"
run = ["mise exec -- rustfmt --edition 2024 scripts/check.rs", "mise exec -- oxfmt"]

[tasks."fmt:check"]
description = "対応ファイルの整形を検査する"
run = ["mise exec -- rustfmt --edition 2024 --check scripts/check.rs", "mise exec -- oxfmt --check"]

[tasks.check]
description = "全 Kustomize ルートを探索して描画する"
run = "mise exec -- cargo -Zscript scripts/check.rs"
